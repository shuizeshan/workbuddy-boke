services:
  bot-api:
    image: docker.m.daocloud.io/library/node:20-alpine
    container_name: bot-api
    restart: unless-stopped
    working_dir: /app
    environment:
      PORT: 3001
      HALO_BASE: http://127.0.0.1:28090
      DEEPSEEK_KEY: ${DEEPSEEK_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      HALO_PAT: ${HALO_PAT}
      LEDGER_PATH: /app/data/ledger.json
      SYSTEM_PROMPT: ${SYSTEM_PROMPT}
    volumes:
      - ./server.js:/app/server.js:ro
      - ./data:/app/data
    network_mode: host
    command: node server.js

  bot-nginx:
    image: docker.m.daocloud.io/library/nginx:alpine
    container_name: bot-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api-bot.html:/usr/share/nginx/html/api-bot.html:ro
    network_mode: host
    depends_on:
      - bot-api
