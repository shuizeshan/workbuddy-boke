# 机器人 + 博客统一入口
# 28090：花生壳外网映射入口（原 Halo 端口，现由本 nginx 接管分流）
# 18080：内网备用入口
# 分流规则：/bot* 与 /bot-api* 给机器人，其余原样转发 Halo(28091)，博客零改动

server {
    listen 28090;
    listen 18080;
    server_name _;

    # /bot 页面由 nginx 直接托管，不再依赖 Halo 建页 + iframe + 破缓存
    location = /bot {
        rewrite ^ /bot.html last;
    }
    location = /bot/ {
        rewrite ^ /bot.html last;
    }
    location = /bot.html {
        alias /usr/share/nginx/html/api-bot.html;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 机器人前端 iframe 资源：Halo 默认给主题静态资源 max-age=31536000（缓存一年），
    # 导致改了 api-bot.html 后浏览器仍读旧缓存（?v 不变时尤其明显）。
    # 单独命中此路径并覆盖为 no-store，以后改前端无需手动清缓存/改 ?v。
    location = /themes/theme-luye/assets/api-bot.html {
        proxy_pass http://127.0.0.1:28091;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 机器人 API：转发到 Node 代理
    location /bot-api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        client_max_body_size 128k;
    }

    # /ai 页面（Halo 正文含机器人 iframe）：整页 no-store + 去掉 ETag/Last-Modified，
    # 强制每次刷新都重新拉页面 HTML；并把 iframe 的 src 从「主题目录 api-bot.html?v=8」
    # 直接改指向 nginx 静态托管的 /bot（已是新版 + no-store），彻底绕开主题目录一年缓存。
    location = /ai {
        proxy_pass http://127.0.0.1:28091;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        # 顺序很重要：先匹配 Halo 原始的完整绝对 URL → /bot（nginx 静态托管新版），
        # 再兜底把残余域名换相对路径。多条 sub_filter 各自基于原始响应，互不串联。
        sub_filter 'https://<你的壳域名>/themes/theme-luye/assets/api-bot.html?v=8' '/bot';
        sub_filter 'https://<你的壳域名>/' '/';
        sub_filter_once off;
        sub_filter_types text/html application/json;
    }

    # 其余全部转发给 Halo（已挪到 28091），博客零改动
    location / {
        proxy_pass http://127.0.0.1:28091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 100m;

        # 关键修复(2026-11-25 二次)：Halo 页面正文里的 iframe 写死了外网绝对域名
        # https://<你的壳域名>/... ，内网访问时 iframe 跨域加载 → 带外网 Cookie，
        # 与内网登录态不通 → "点登录没反应 / 登录后仍显示需登录"。
        #
        # 上一轮为何失效（假阳性）：Halo 对 /ai 返回 content-encoding:gzip，
        # nginx sub_filter 无法处理压缩流；curl 默认不带 Accept-Encoding 才"看似生效"，
        # 真实浏览器带 gzip → iframe 仍是外网绝对域名 → 跨域。
        # 正解：① 强制上游不压缩 ② sub_filter_types 同时覆盖 text/html + application/json。
        proxy_set_header Accept-Encoding "";
        # 先匹配完整绝对 URL → /bot，再兜底域名换相对路径（多条 sub_filter 各自基于原始响应）
        sub_filter 'https://<你的壳域名>/themes/theme-luye/assets/api-bot.html?v=8' '/bot';
        sub_filter 'https://<你的壳域名>/' '/';
        sub_filter_once off;
        # text/html 是 sub_filter 默认类型；显式列出避免 location 继承歧义
        sub_filter_types text/html application/json;
    }
}
