# AI 服务自定义编排（1Panel「编排」功能用）
# 用法：1Panel → 容器 → 编排 → 创建编排 → 粘贴本文件全部内容
# 注意：不要用 1Panel 应用商店一键安装（商店模板无资源护栏）

services:
  ollama:
    image: docker.m.daocloud.io/ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    mem_limit: 4g          # 硬护栏：内存最多 4GB，超限被杀不拖累 NAS
    cpus: 2.0              # 硬护栏：最多用满 2 核，NAS 日常服务永远优先
    ports:
      - "11434:11434"      # 仅内网访问，禁止做花生壳映射
    volumes:
      - /vol1/ai/ollama:/root/.ollama   # 模型文件持久化（约2.5GB/个模型）
    environment:
      - OLLAMA_NUM_PARALLEL=1        # 只允许1个并发请求（CPU推理防排队雪崩）
      - OLLAMA_MAX_LOADED_MODELS=1   # 内存只驻留1个模型
      - OLLAMA_KEEP_ALIVE=5m         # 空闲5分钟自动卸载模型释放内存
      - OLLAMA_FLASH_ATTENTION=1     # 注意力优化，降低显存/内存占用
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  open-webui:
    image: ghcr.m.daocloud.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    mem_limit: 1.5g         # 硬护栏：WebUI 上限 1.5GB（main完整版含本地向量库）
    cpus: 1.0
    depends_on:
      - ollama
    ports:
      - "3000:8080"         # 聊天入口 http://<NAS_IP>:3000（仅内网）
    volumes:
      - /vol1/ai/open-webui:/app/backend/data   # 对话历史+知识库数据持久化
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434   # 通过容器网络直连 ollama
      - WEBUI_AUTH=true                       # 强制账号登录（安全要求）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# 资源合计护栏：内存 ≤5GB（占可用11GB的45%）、CPU ≤3核（共4核）
# 移除方法：1Panel 编排页点「删除」→ 容器+数据卷引用一并清理；模型文件在 /vol1/ai/ 下手动删
